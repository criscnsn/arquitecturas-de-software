================================================================================
Vista del EMPLEADO — Directorio y Estado Personal (Solo lectura)
Responsable: Mateo Alejandro Caamal Tencle (MateoAlejandroCaamalTencle)
================================================================================
Función de este archivo:
Pantalla a la que accede un usuario con rol EMPLEADO al iniciar sesión.
Le permite consultar su propia información laboral (estado y antigüedad en la
empresa) y ver el listado de empleados identificando y resaltando su propia fila
en otro color, SIN controles de creación, edición ni eliminación.

Contrato con EmpleadoController y AuthController (Gael):
- Atributos de modelo disponibles:
    * ${empleados}              -> Lista de empleados (rol EMPLEADO)
    * ${session.usuarioSesion}  -> Empleado autenticado actualmente en sesión
- Rutas HTTP a conectar:
    * POST /logout              -> Botón "Cerrar sesión"

   - Fecha de ingreso (`fechaIngreso`) y tiempo en la empresa (`antiguedad`).
   - Su propio salario (privado, visible solo en su tarjeta personal y NO en la tabla de compañeros).
