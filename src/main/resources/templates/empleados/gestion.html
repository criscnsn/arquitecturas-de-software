<!--
================================================================================
Vista principal del GERENTE — Manejador de Empleados (CRUD + Buscador + Modales)
Responsable: Mateo Alejandro Caamal Tencle (MateoAlejandroCaamalTencle)
Referencia visual: Basarse en la interfaz de ejemplo de la plataforma.
================================================================================
Función de este archivo:
Mostrar al GERENTE el listado de empleados (nunca gerentes) con la estética de la
interfaz de ejemplo de la plataforma, permitiendo buscar, seleccionar uno o todos
los empleados y realizar altas, ediciones y eliminaciones mediante ventanas
flotantes (modales de Bootstrap) sin cambiar de pantalla.

Contrato con EmpleadoController y AuthController (Gael):
- Atributos de modelo disponibles:
    * ${empleados}              -> Lista de Usuario con rol EMPLEADO
    * ${estados}                -> Valores de EstadoEmpleado (ACTIVO, VACACIONES, INCAPACIDAD)
    * ${q}                      -> Término actual del buscador
    * ${nuevoEmpleado}          -> Objeto vacío para el formulario del modal de creación
    * ${mensajeExito} / ${mensajeError} -> Mensajes flash tras operaciones CRUD
    * ${session.usuarioSesion}  -> Gerente autenticado actualmente en sesión
- Rutas HTTP a conectar:
    * GET  /empleados?q=...                  -> Formulario del Buscador (nombre, correo o teléfono; NO dirección)
    * POST /empleados/crear                  -> Formulario del modal "Añadir nuevo empleado"
    * POST /empleados/editar/{id}            -> Formulario del modal "Editar empleado"
    * POST /empleados/eliminar/{id}          -> Formulario del modal "Eliminar empleado individual"
    * POST /empleados/eliminar-seleccionados -> Formulario del modal "Eliminar seleccionados" (envía lista `ids`)
    * POST /logout                           -> Botón "Cerrar sesión"
