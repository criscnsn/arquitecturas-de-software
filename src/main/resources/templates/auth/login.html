<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Manejador de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
    <div class="card card-auth">
        <div class="card-auth-header">
            <i class="bi bi-people-fill fs-1 mb-2 d-block"></i>
            <h1 class="h4 mb-1">Manejador de Empleados</h1>
            <p class="small mb-0 opacity-75">Ingresa tus credenciales para acceder al sistema</p>
        </div>


<div class="card-body p-4">
            <!-- Alerta de error cuando las credenciales son incorrectas -->
            <div th:if="${errorLogin}" class="alert alert-danger d-flex align-items-center py-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorLogin}">Usuario o contraseña incorrectos.</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="usuario" class="form-label fw-semibold">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text"
                               class="form-control"
                               id="usuario"
                               name="usuario"
                               maxlength="30"
                               placeholder="Ej. admin.gerente"
                               required
                               autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="contrasena" class="form-label fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password"
                               class="form-control"
                               id="contrasena"
                               name="contrasena"
                               maxlength="16"
                               placeholder="Máximo 16 caracteres"
                               required>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary fw-semibold py-2"
                            style="background-color: #435d7d; border-color: #435d7d;">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
