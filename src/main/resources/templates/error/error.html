<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — Manejador de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
    <div class="card card-error p-4 text-center">
        <div class="card-body">
            <i class="bi bi-exclamation-octagon-fill text-danger" style="font-size: 3.2rem;"></i>
            <h1 class="h4 mt-3 fw-bold"
                th:text="${tituloError != null ? tituloError : 'Error en la operación'}">
                Error en la operación
            </h1>
            <p class="text-muted mt-2 mb-4"
               th:text="${mensajeError != null ? mensajeError : 'Ocurrió un problema inesperado al procesar tu solicitud.'}">
                Descripción detallada del error.
            </p>
            <a th:href="@{/}" class="btn btn-primary px-4"
               style="background-color: #435d7d; border-color: #435d7d;">
                <i class="bi bi-house-door-fill me-1"></i> Volver al inicio
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
