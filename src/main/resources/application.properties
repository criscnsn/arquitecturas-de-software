# ==============================================================================
# Configuración general de Spring Boot y MySQL — Manejador de Empleados
# Responsable principal: Cristopher Israel Cen Santana (criscnsn)
# ==============================================================================
# Nota para el equipo:
# Si tu contraseña/puerto local de MySQL es diferente, crea un archivo llamado
# `application-local.properties` en la raíz del proyecto (ya está en .gitignore)
# con tus credenciales locales y Spring Boot las cargará automáticamente.
# ==============================================================================

spring.application.name=PF_CRUD_Framework
server.port=8080

# Sobrescritura opcional de credenciales locales sin ensuciar Git
spring.config.import=optional:file:./application-local.properties

# --- Conexión a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/empleados_crud_db?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuración JPA / Hibernate ---
# El esquema (ENUM, CHECK e índices) se controla desde sql/schema_and_data.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Configuración Thymeleaf (desactivar caché en desarrollo) ---
spring.thymeleaf.cache=false

# --- Configuración de sesiones HTTP (Mejora: Manejo de sesiones) ---
server.servlet.session.timeout=30m
